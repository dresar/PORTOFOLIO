name: '💡 Usulan Fitur (Feature Request)'
description: 'Sampaikan ide fitur baru atau peningkatan visual / UX'
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Punya ide untuk membuat website portofolio ini lebih menarik, fungsional, atau interaktif? Sampaikan ide Anda di bawah ini.

  - type: textarea
    id: idea
    attributes:
      label: Ide / Fitur yang Diusulkan
      description: Deskripsikan fitur baru yang ingin ditambahkan secara ringkas dan jelas.
      placeholder: Tambahkan fitur animasi interaktif 3D atau mode tampilan baru...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Alasan & Manfaat
      description: Mengapa fitur ini bermanfaat bagi pengunjung atau representasi portofolio?
      placeholder: Fitur ini akan mempermudah navigasi bagi pengunjung mobile...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatif / Referensi
      description: Sertakan tautan referensi desain atau pustaka jika ada (misal Dribbble, Figma, Framer).
      placeholder: Contoh implementasi serupa di website ...

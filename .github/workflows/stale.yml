name: 'Stale Issues & PRs'

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'Issue ini belum memiliki aktivitas selama 60 hari dan ditandai sebagai stale. Issue akan ditutup secara otomatis jika tidak ada aktivitas lebih lanjut dalam 7 hari.'
          stale-pr-message: 'Pull Request ini tidak aktif selama 45 hari dan ditandai sebagai stale.'
          days-before-issue-stale: 60
          days-before-pr-stale: 45
          days-before-issue-close: 7
          days-before-pr-close: 14
          exempt-issue-labels: 'pinned,security,in-progress'
          exempt-pr-labels: 'pinned,security,in-progress'

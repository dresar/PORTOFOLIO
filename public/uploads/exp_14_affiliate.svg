<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="shopeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee4d2d" />
      <stop offset="100%" stop-color="#ff7337" />
    </linearGradient>
    <linearGradient id="tiktokGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#fe0979" />
    </linearGradient>
  </defs>

  <!-- Background rounded box -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)" />
  <rect width="196" height="196" x="2" y="2" rx="42" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Shopping Bag (Shopee icon) -->
  <path d="M68 76 C68 58 82 46 100 46 C118 46 132 58 132 76" fill="none" stroke="url(#shopeeGrad)" stroke-width="9" stroke-linecap="round" />
  <rect x="52" y="76" width="96" height="84" rx="18" fill="url(#shopeeGrad)" />

  <!-- Music note & play symbol (TikTok style) inside bag -->
  <circle cx="90" cy="126" r="11" fill="#ffffff" />
  <circle cx="114" cy="116" r="11" fill="#ffffff" />
  <path d="M98 126 L98 94 C98 91 100 89 103 89 L122 83 C125 82 128 84 128 87 L128 116" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Affiliate star / sparkle badge -->
  <circle cx="148" cy="62" r="18" fill="#06b6d4" />
  <polygon points="148,50 152,58 160,62 152,66 148,74 144,66 136,62 144,58" fill="#ffffff" />
